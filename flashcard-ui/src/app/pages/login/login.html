<div class="flex min-h-screen items-center justify-center bg-slate-900 px-4 py-12 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 bg-slate-800 p-8 rounded-xl shadow-lg border border-slate-700">
    <div>
      <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-white">Sign in to your account</h2>
      <p class="mt-2 text-center text-sm text-slate-400">
        Or 
        <a routerLink="/register" class="font-medium text-indigo-400 hover:text-indigo-300">create a new account</a>
      </p>
    </div>
    
    <form class="mt-8 space-y-6" (ngSubmit)="onSubmit()">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Username</label>
          <input [(ngModel)]="credentials.username" name="username" type="text" required 
            class="relative block w-full rounded-lg border-0 bg-slate-700 py-3 px-4 text-white placeholder-slate-400 ring-1 ring-inset ring-slate-600 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm" placeholder="Your username">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
          <input [(ngModel)]="credentials.password" name="password" type="password" required 
            class="relative block w-full rounded-lg border-0 bg-slate-700 py-3 px-4 text-white placeholder-slate-400 ring-1 ring-inset ring-slate-600 focus:ring-2 focus:ring-inset focus:ring-indigo-500 sm:text-sm" placeholder="••••••••">
        </div>
      </div>

      <div class="flex items-center justify-end">
        <a routerLink="/forgot-password" class="text-sm font-medium text-indigo-400 hover:text-indigo-300">
          Forgot your password?
        </a>
      </div>

      @if (errorMessage) {
        <div class="text-red-400 text-sm text-center">
          {{ errorMessage }}
        </div>
      }

      <div>
        <button type="submit" 
          class="group relative flex w-full justify-center rounded-lg bg-indigo-600 px-3 py-3 text-sm font-semibold text-white hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-colors">
          Sign In
        </button>
      </div>
    </form>
  </div>
</div>
